<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba impresora Bluetooth – Phone SV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f4f6; color: #111; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #666; font-size: 14px; }
  button { display: block; width: 100%; padding: 14px; margin: 0 0 10px; font-size: 16px; font-weight: 600;
           border: 0; border-radius: 12px; background: #111; color: #fff; }
  button.sec { background: #fff; color: #111; border: 1px solid #ccc; }
  button:disabled { opacity: .4; }
  #estado { padding: 10px 12px; border-radius: 10px; background: #fff; margin-bottom: 14px; font-size: 14px; }
  #log { font: 12px/1.4 ui-monospace, Menlo, monospace; background: #fff; border-radius: 10px; padding: 10px;
         height: 160px; overflow: auto; white-space: pre-wrap; margin-top: 14px; }
  /* Ticket de ejemplo: 576 px = 72 mm de impresión a 203 dpi */
  #ticket { width: 576px; background: #fff; color: #000; padding: 16px 12px; font-family: Arial, sans-serif;
            transform-origin: top left; }
  #ticket h2 { text-align: center; font-size: 40px; margin: 0; }
  #ticket .c { text-align: center; font-size: 22px; }
  #ticket table { width: 100%; font-size: 24px; border-collapse: collapse; margin-top: 10px; }
  #ticket td { padding: 4px 0; }
  #ticket td:last-child { text-align: right; }
  #ticket .tot td { border-top: 3px dashed #000; font-weight: 700; font-size: 30px; padding-top: 8px; }
  .wrap { overflow: hidden; border-radius: 10px; margin-top: 14px; }
</style>
</head>
<body>
  <h1>Prueba impresora Bluetooth</h1>
  <p class="sub">Abre esta página en <b>Bluefy</b> (Safari no permite Bluetooth).</p>

  <div id="estado">Sin conectar</div>

  <label for="velocidad" style="font-size:14px;font-weight:600">Velocidad de envío</label>
  <select id="velocidad" style="width:100%;padding:12px;font-size:16px;border-radius:12px;margin:6px 0 14px;border:1px solid #ccc;background:#fff">
    <option value="180,15">1 · Normal (la de antes)</option>
    <option value="180,5">2 · Rápida</option>
    <option value="180,0" selected>3 · Muy rápida</option>
    <option value="500,0">4 · Máxima (experimental)</option>
  </select>

  <button id="btnConectar">1. Conectar impresora</button>
  <button id="btnPrueba" disabled>2. Imprimir "PRUEBA" y cortar</button>
  <button id="btnTicket" disabled>3. Imprimir ticket de ejemplo</button>
  <button id="btnCorte" class="sec" disabled>Solo cortar</button>

  <div class="wrap"><div id="ticket">
    <h2>PHONE SV</h2>
    <div class="c">Ticket de prueba</div>
    <div class="c" id="fecha"></div>
    <table>
      <tr><td>iPhone 13 128GB</td><td>$420.00</td></tr>
      <tr><td>Cargador 20W</td><td>$15.00</td></tr>
      <tr><td>Funda MagSafe</td><td>$12.00</td></tr>
      <tr class="tot"><td>TOTAL</td><td>$447.00</td></tr>
    </table>
    <div class="c" style="margin-top:14px">¡Gracias por su compra!</div>
  </div></div>

  <div id="log"></div>

<script>
/* ================= Impresora BLE (ESC/POS) =================
   Funciones reutilizables para tus tickets:
     await Impresora.conectar()
     await Impresora.imprimirCanvas(canvas)   // imprime una imagen y corta
     await Impresora.cortar()
============================================================ */
const Impresora = (() => {
  // Servicios BLE que usan la mayoría de impresoras térmicas chinas
  const SERVICIOS = [
    '000018f0-0000-1000-8000-00805f9b34fb',
    '0000ff00-0000-1000-8000-00805f9b34fb',
    '0000ffe0-0000-1000-8000-00805f9b34fb',
    '0000ae30-0000-1000-8000-00805f9b34fb',
    '0000fee7-0000-1000-8000-00805f9b34fb',
    'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455'
  ];
  const ANCHO = 576;        // puntos por línea (72 mm a 203 dpi)
  const TROZO = 180;        // bytes por envío BLE
  let dispositivo = null, caract = null, sinRespuesta = false;

  async function conectar() {
    if (!navigator.bluetooth) throw new Error('Este navegador no tiene Bluetooth. Abre la página en Bluefy.');
    dispositivo = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICIOS });
    log('Dispositivo: ' + (dispositivo.name || 'sin nombre'));
    dispositivo.addEventListener('gattserverdisconnected', () => { caract = null; estado('Desconectada', false); });
    const servidor = await dispositivo.gatt.connect();
    const servicios = await servidor.getPrimaryServices();
    for (const s of servicios) {
      for (const c of await s.getCharacteristics()) {
        if (c.properties.write || c.properties.writeWithoutResponse) {
          caract = c;
          sinRespuesta = !c.properties.write && c.properties.writeWithoutResponse;
          log('Servicio ' + s.uuid + '\nCaracterística ' + c.uuid);
          return dispositivo.name || 'Impresora';
        }
      }
    }
    throw new Error('Conectó, pero no encontré un canal para enviar datos.');
  }

  async function enviar(bytes) {
    if (!caract) {
      if (dispositivo && dispositivo.gatt) { await dispositivo.gatt.connect(); await conectarDeNuevo(); }
      else throw new Error('Primero conecta la impresora.');
    }
    const { trozo, pausa } = velocidad();
    for (let i = 0; i < bytes.length; i += trozo) {
      const parte = bytes.slice(i, i + trozo);
      if (sinRespuesta) { await caract.writeValueWithoutResponse(parte); if (pausa) await espera(pausa); }
      else await caract.writeValue(parte);
    }
  }

  // Velocidad elegida en la página: "trozo" = bytes por envío, "pausa" = ms entre envíos
  function velocidad() {
    const sel = document.getElementById('velocidad');
    const [trozo, pausa] = (sel ? sel.value : '180,15').split(',').map(Number);
    return { trozo, pausa };
  }

  async function conectarDeNuevo() {
    const servicios = await dispositivo.gatt.getPrimaryServices();
    for (const s of servicios) for (const c of await s.getCharacteristics())
      if (c.properties.write || c.properties.writeWithoutResponse) {
        caract = c; sinRespuesta = !c.properties.write; return;
      }
  }

  // Convierte un canvas a comandos raster ESC/POS (GS v 0), en bandas
  function canvasARaster(canvasOrig) {
    const escala = ANCHO / canvasOrig.width;
    const alto = Math.round(canvasOrig.height * escala);
    const cv = document.createElement('canvas');
    cv.width = ANCHO; cv.height = alto;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, ANCHO, alto);
    ctx.drawImage(canvasOrig, 0, 0, ANCHO, alto);
    const px = ctx.getImageData(0, 0, ANCHO, alto).data;
    const bpl = ANCHO / 8, BANDA = 200, salida = [];

    // 1) Convertir cada fila a bits y marcar si está en blanco
    const filas = [];
    for (let y = 0; y < alto; y++) {
      const fila = new Uint8Array(bpl); let vacia = true;
      for (let xb = 0; xb < bpl; xb++) {
        let b = 0;
        for (let bit = 0; bit < 8; bit++) {
          const i = (y * ANCHO + xb * 8 + bit) * 4;
          const lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
          if (px[i + 3] > 128 && lum < 140) b |= 0x80 >> bit;
        }
        fila[xb] = b; if (b) vacia = false;
      }
      filas.push({ fila, vacia });
    }

    // 2) Filas en blanco: solo avanzar papel (ESC J n), sin mandar la imagen
    //    Filas con contenido: imagen raster (GS v 0) en bloques de hasta BANDA filas
    let y = 0;
    while (y < alto) {
      if (filas[y].vacia) {
        let n = 0;
        while (y < alto && filas[y].vacia) { n++; y++; }
        while (n > 0) { const m = Math.min(255, n); salida.push(0x1B, 0x4A, m); n -= m; }
      } else {
        const ini = y;
        while (y < alto && !filas[y].vacia && y - ini < BANDA) y++;
        const h = y - ini;
        salida.push(0x1D, 0x76, 0x30, 0x00, bpl & 255, bpl >> 8, h & 255, h >> 8);
        for (let k = ini; k < y; k++) for (const b of filas[k].fila) salida.push(b);
      }
    }
    return new Uint8Array(salida);
  }

  const INICIO = new Uint8Array([0x1B, 0x40]);                  // ESC @  (reiniciar)
  const CORTE  = new Uint8Array([0x1B, 0x64, 0x04,              // ESC d 4 (avanzar 4 líneas)
                                 0x1D, 0x56, 0x42, 0x00]);      // GS V 66 0 (cortar)

  async function imprimirCanvas(canvas) {
    const datos = canvasARaster(canvas);
    const t0 = performance.now();
    await enviar(INICIO);
    await enviar(datos);
    await enviar(CORTE);
    const seg = ((performance.now() - t0) / 1000).toFixed(1);
    log('Enviados ' + (datos.length / 1024).toFixed(1) + ' KB en ' + seg + ' s ' +
        '(' + (sinRespuesta ? 'sin respuesta' : 'con respuesta') + ')');
  }
  async function cortar() { await enviar(CORTE); }

  return { conectar, imprimirCanvas, cortar, enviar };
})();

/* ================= Interfaz de la página de prueba ================= */
const $ = id => document.getElementById(id);
const espera = ms => new Promise(r => setTimeout(r, ms));
function log(t) { $('log').textContent += t + '\n'; $('log').scrollTop = 1e9; }
function estado(t, ok) {
  $('estado').textContent = t;
  $('estado').style.background = ok ? '#e3f7e8' : '#fff';
  ['btnPrueba', 'btnTicket', 'btnCorte'].forEach(id => $(id).disabled = !ok);
}
async function accion(fn, msg) {
  try { log(msg); await fn(); log('✔ Listo'); }
  catch (e) { log('✖ ' + e.message); alertaSuave(e.message); }
}
function alertaSuave(m) { $('estado').textContent = '⚠ ' + m; $('estado').style.background = '#fdecea'; }

$('fecha').textContent = new Date().toLocaleString('es-SV');

$('btnConectar').onclick = () => accion(async () => {
  const nombre = await Impresora.conectar();
  estado('Conectada: ' + nombre, true);
}, 'Buscando impresoras…');

$('btnPrueba').onclick = () => accion(async () => {
  const cv = document.createElement('canvas');
  cv.width = 576; cv.height = 200;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 576, 200);
  ctx.fillStyle = '#000'; ctx.textAlign = 'center';
  ctx.font = 'bold 64px Arial'; ctx.fillText('PRUEBA', 288, 90);
  ctx.font = '26px Arial'; ctx.fillText(new Date().toLocaleString('es-SV'), 288, 150);
  await Impresora.imprimirCanvas(cv);
}, 'Imprimiendo PRUEBA…');

$('btnTicket').onclick = () => accion(async () => {
  const cv = await html2canvas($('ticket'), { backgroundColor: '#fff', scale: 1 });
  await Impresora.imprimirCanvas(cv);
}, 'Imprimiendo ticket…');

$('btnCorte').onclick = () => accion(() => Impresora.cortar(), 'Enviando corte…');

// Ajusta la vista del ticket al ancho del celular (solo visual)
function ajustar() {
  const w = $('ticket').parentElement.clientWidth;
  const s = Math.min(1, w / 576);
  $('ticket').style.transform = 'scale(' + s + ')';
  $('ticket').parentElement.style.height = ($('ticket').offsetHeight * s) + 'px';
}
window.addEventListener('resize', ajustar); ajustar();
</script>
</body>
</html>
